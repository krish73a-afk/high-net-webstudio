<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img" aria-labelledby="title desc">
<title id="title">Friendly fitness studio scene</title><desc id="desc">Illustrated indoor gym with weight equipment, exercise mats, plants and natural light</desc>
<defs>
  <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#dcecd5"/><stop offset="1" stop-color="#eff5e5"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e4e6cd"/><stop offset="1" stop-color="#cccfb4"/></linearGradient>
  <linearGradient id="steel" x1="0" x2="1"><stop stop-color="#536e64"/><stop offset=".5" stop-color="#a8b4a9"/><stop offset="1" stop-color="#3c5a51"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="720" height="650" rx="46" fill="#d7e4cf"/>
<rect x="42" y="45" width="636" height="562" rx="31" fill="url(#wall)"/>
<path d="M42 435H678V576Q678 607 647 607H73Q42 607 42 576Z" fill="url(#floor)"/>
<path d="M42 439h636" stroke="#b3c9b0" stroke-width="8"/>
<!-- light window -->
<rect x="92" y="90" width="232" height="256" rx="20" fill="#f8fcfa" stroke="#a9bfaa" stroke-width="11"/>
<path d="M208 95V340M98 214H318" stroke="#b2c7bc" stroke-width="10"/>
<rect x="112" y="112" width="86" height="95" rx="5" fill="#cde9e0"/><rect x="220" y="112" width="84" height="95" rx="5" fill="#d9f1e7"/>
<rect x="112" y="223" width="86" height="105" rx="5" fill="#dbefdc"/><rect x="220" y="223" width="84" height="105" rx="5" fill="#d9e8f4"/>
<path d="M132 208c17-37 34-34 53-6M246 212q18-32 50-16M122 329q20-36 57-10" fill="none" stroke="#93bea5" stroke-width="5" opacity=".8"/>
<!-- upper wall -->
<path d="M365 103h211" stroke="#bdd1bf" stroke-width="8" stroke-linecap="round"/>
<path d="M366 125h132" stroke="#d7e5cf" stroke-width="6" stroke-linecap="round"/>
<rect x="387" y="160" width="171" height="84" rx="18" fill="#2b4540"/>
<path d="M415 202h115" stroke="#baf27b" stroke-width="8" stroke-linecap="round"/>
<path d="M472 174v56" stroke="#baf27b" stroke-width="8" stroke-linecap="round"/>
<!-- rack -->
<g stroke="#345c4b" stroke-width="14" stroke-linecap="round"><path d="M372 288v241M622 285v244M368 309H626"/></g>
<path d="M356 531h35m215 0h34" stroke="#345c4b" stroke-width="16" stroke-linecap="round"/>
<!-- barbell -->
<path d="M336 361h306" stroke="url(#steel)" stroke-width="11" stroke-linecap="round"/>
<g fill="#283f38"><rect x="354" y="325" width="16" height="72" rx="8"/><rect x="375" y="337" width="18" height="48" rx="9"/><rect x="587" y="337" width="18" height="48" rx="9"/><rect x="611" y="325" width="16" height="72" rx="8"/></g>
<!-- mat -->
<ellipse cx="260" cy="533" rx="170" ry="20" fill="#496654" opacity=".13" filter="url(#shadow)"/>
<path d="M118 509l219-25 76 47-226 31Z" fill="#e49b71" stroke="#be7b57" stroke-width="5"/>
<path d="M135 516l205-22" stroke="#f0b694" stroke-width="6" stroke-linecap="round"/>
<!-- bench -->
<path d="M471 479l-36 80m124-81 46 79" stroke="#344f45" stroke-width="13" stroke-linecap="round"/>
<path d="M449 462h113" stroke="#25453b" stroke-width="25" stroke-linecap="round"/>
<path d="M441 460h122" stroke="#a8ed79" stroke-width="12" stroke-linecap="round"/>
<!-- dumbbells -->
<g transform="translate(126 405) rotate(-12)"><rect x="0" y="14" width="96" height="13" rx="6" fill="#59766b"/><rect x="-4" y="0" width="22" height="42" rx="7" fill="#284b40"/><rect x="80" y="0" width="22" height="42" rx="7" fill="#284b40"/></g>
<g transform="translate(180 429) rotate(16)"><rect x="0" y="13" width="100" height="12" rx="6" fill="#6e847d"/><rect x="-3" y="0" width="22" height="42" rx="7" fill="#536f60"/><rect x="80" y="0" width="22" height="42" rx="7" fill="#536f60"/></g>
<!-- plant -->
<path d="M620 492l14 82h45l10-82Z" fill="#e6a678"/>
<g fill="none" stroke="#568f6e" stroke-width="10" stroke-linecap="round"><path d="M649 491q-26-75-6-106"/><path d="M653 498q37-67 27-91"/><path d="M647 492q-47-28-53-61"/></g>
<g fill="#77ad74"><ellipse cx="627" cy="417" rx="18" ry="38" transform="rotate(-34 627 417)"/><ellipse cx="673" cy="427" rx="17" ry="42" transform="rotate(35 673 427)"/><ellipse cx="598" cy="451" rx="15" ry="34" transform="rotate(-49 598 451)"/></g>
<!-- decorative light -->
<circle cx="310" cy="105" r="12" fill="#fff" opacity=".75"/><circle cx="337" cy="129" r="5" fill="#fff" opacity=".75"/>
</svg>
